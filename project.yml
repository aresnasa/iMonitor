name: iMonitor

options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    PRODUCT_NAME: iMonitor
    MACOSX_DEPLOYMENT_TARGET: "12.0"

targets:
  iMonitor:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: iMonitor
        excludes:
          - Info.plist
          - iMonitor.entitlements
          - iMonitor-adhoc.entitlements
          - Assets.xcassets
          - "Preview Content"
          - Base.lproj
          - iMonitorApp.swift
      - path: iMonitor/Assets.xcassets
        buildPhase: resources
      - path: iMonitor/Preview Content/Preview Assets.xcassets
        buildPhase: resources
      - path: iMonitor/Base.lproj/Main.storyboard
        buildPhase: resources
    entitlements:
      path: iMonitor/iMonitor.entitlements
    settings:
      base:
        ARCHS: "$(ARCHS_STANDARD)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        # The re-sign phase below shells out to `security`/`codesign`; keep the
        # script out of the sandbox so it can reach the login keychain.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        # Products land in "<Configuration>.noindex" so Spotlight - and the Apps
        # view built on it - never lists Xcode's DerivedData copy or build.sh's
        # copy as extra iMonitor apps beside the installed one. macOS honours a
        # ".noindex" folder suffix (a .metadata_never_index marker is ignored
        # on macOS 27). Xcode already names its Intermediates folder this way.
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME).noindex"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_ASSET_PATHS: '"iMonitor/Preview Content"'
        # HiddenBar: Obj-C shim for macOS 27's private MenuBarClientCore.
        SWIFT_OBJC_BRIDGING_HEADER: iMonitor/iMonitor-Bridging-Header.h
        OTHER_CFLAGS:
          - "$(inherited)"
          - "-fobjc-arc"

        INFOPLIST_FILE: iMonitor/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: 0.5.14
        PRODUCT_BUNDLE_IDENTIFIER: com.aresnasa.iMonitor
        SWIFT_VERSION: 5.0

      configs:
        Debug:
          # macOS 27 native menu-bar hiding (private MenuBarClientCore shim).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG HIDDENBAR_NATIVE_VISIBILITY"
          GCC_PREPROCESSOR_DEFINITIONS:
            - "$(inherited)"
            - "DEBUG=1"
            - "HIDDENBAR_NATIVE_VISIBILITY=1"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HIDDENBAR_NATIVE_VISIBILITY"
          GCC_PREPROCESSOR_DEFINITIONS:
            - "$(inherited)"
            - "HIDDENBAR_NATIVE_VISIBILITY=1"

    postBuildScripts:
      # Xcode's product is left unsigned (CODE_SIGNING_ALLOWED=NO above) with
      # only the linker's ad-hoc signature, which macOS treats as a new identity
      # on every build - Accessibility grants then never stick to it: the grant
      # belongs to a different build until it is re-signed with a stable
      # certificate. When this Mac has the local certificate, sign the product
      # with it, so one grant covers Xcode runs, /Applications copies and all
      # future rebuilds alike. Without the certificate (CI, other Macs) the
      # phase leaves the linker's ad-hoc signature alone.
      - name: Stabilize signing identity
        basedOnDependencyAnalysis: false
        script: |
          APP="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          ID="iMonitor Local Signing"
          [ -d "$APP" ] || exit 0
          if ! security find-identity -v -p codesigning 2>/dev/null | grep -qF "$ID"; then
            echo "note: '$ID' not found - keeping the linker's ad-hoc signature"
            exit 0
          fi
          for nested in "$APP"/Contents/Frameworks/* "$APP"/Contents/PlugIns/* "$APP"/Contents/Library/*; do
            [ -e "$nested" ] || continue
            codesign --force --sign "$ID" --timestamp=none "$nested" \
              || echo "warning: failed to sign '$nested'"
          done
          if codesign --force --sign "$ID" --timestamp=none "$APP"; then
            echo "signed '$APP' with '$ID'"
          else
            echo "warning: failed to sign with '$ID' - keeping the ad-hoc signature"
          fi

schemes:
  iMonitor:
    build:
      targets:
        iMonitor: all
    run:
      config: Debug
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    test:
      config: Debug
